<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我們班</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cls-theme')||'light'}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=light]{--bg:#faf8f3;--card:#fff;--ink:#17140f;--mute:#7a7366;--line:rgba(40,30,10,.1);--hover:rgba(60,45,10,.05);--chip:rgba(60,45,10,.06);--gt:#8a6200;--gbg:linear-gradient(160deg,#fffaf0,#fff0c8);--glow:rgba(212,175,55,.2);--topbg:rgba(250,248,243,.82);color-scheme:light}
[data-theme=dark]{--bg:#0e0e10;--card:#17171a;--ink:#f4f1ea;--mute:#a39d90;--line:rgba(255,255,255,.1);--hover:rgba(255,255,255,.06);--chip:rgba(255,255,255,.08);--gt:#e8c34a;--gbg:linear-gradient(160deg,#211b0f,#120f09);--glow:rgba(212,175,55,.15);--topbg:rgba(14,14,16,.82);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:90px}
body{margin:0;background:radial-gradient(70% 45% at 85% 0,var(--glow),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font:400 16px/1.65 "Noto Sans TC",system-ui,sans-serif;transition:background-color .25s,color .25s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--topbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #d4af37;outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--topbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.tb{max-width:1120px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font:900 18px "Noto Serif TC",serif;white-space:nowrap}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#b8860b,#f6e27a 55%,#d4af37);color:#2a2000;display:grid;place-items:center;font-size:17px}
nav{display:flex;gap:4px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
nav button{background:none;border:0;padding:8px 14px;color:var(--mute);font-weight:700;font-size:14px;position:relative;white-space:nowrap;transition:color .2s}
nav button:hover{color:var(--ink)}
nav button[aria-selected=true]{color:var(--ink)}
nav button[aria-selected=true]::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;border-radius:2px;background:linear-gradient(90deg,#b8860b,#f6e27a,#b8860b)}
#theme{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--chip);display:grid;place-items:center;padding:0}
#theme:hover{background:var(--hover)}
#theme svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
[data-theme=light] .td,[data-theme=dark] .tl{display:none}
main{max-width:1120px;margin:0 auto;padding:0 24px 80px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:36px;align-items:center;padding:56px 0 40px}
.kick{font-size:13px;font-weight:700;letter-spacing:.24em;color:var(--gt)}
h1{font:900 clamp(56px,9.5vw,120px)/1.04 "Noto Serif TC",serif;letter-spacing:.01em;margin:6px 0 14px;overflow-wrap:anywhere}
.tag{margin:0 0 10px;color:var(--mute);font-size:17px;max-width:28em}
.meta{color:var(--mute);font-size:14px}
.note{margin:0 0 20px;font-size:14px;color:#7a5600;background:#fff0c4;border-radius:12px;padding:10px 16px}
.note[hidden]{display:none}
.gold{border-radius:24px;padding:1.5px;background:linear-gradient(115deg,#b8860b,#f6e27a,#d4af37,#fff3b8,#b8860b,#f6e27a);background-size:300% 100%;animation:flow 7s linear infinite;box-shadow:0 18px 50px -18px rgba(212,175,55,.55)}
.in{position:relative;overflow:hidden;border-radius:22.5px;background:var(--gbg);padding:26px 28px}
.in::after{content:"";position:absolute;top:-60%;left:-70%;width:38%;height:220%;transform:rotate(20deg);background:linear-gradient(90deg,transparent,rgba(255,238,170,.5),transparent);animation:sweep 5s ease-in-out infinite;pointer-events:none}
.in::before{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(246,226,122,.45),transparent 70%);animation:pulse 3.5s ease-in-out infinite;pointer-events:none}
.in>*{position:relative;z-index:1}
@keyframes flow{to{background-position:300% 0}}
@keyframes sweep{0%{left:-70%}55%,100%{left:140%}}
@keyframes pulse{50%{opacity:.35;transform:scale(1.15)}}
.gtext{font-weight:900;letter-spacing:.2em;font-size:14px;background:linear-gradient(100deg,#9a6f00 20%,#f0c93c 50%,#9a6f00 80%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 3.5s linear infinite}
[data-theme=dark] .gtext{background-image:linear-gradient(100deg,#c79a1a 20%,#fff1b0 50%,#c79a1a 80%);-webkit-background-clip:text;background-clip:text}
.ah{display:flex;align-items:center}
.feat{font:700 clamp(20px,2.3vw,26px)/1.5 "Noto Serif TC",serif;margin:16px 0 6px;overflow-wrap:anywhere}
.ts{color:var(--mute);font-size:13px}
.older{list-style:none;margin:18px 0 0;padding:12px 0 0;border-top:1px solid rgba(212,175,55,.4)}
.older li{display:flex;gap:14px;justify-content:space-between;align-items:baseline;padding:6px 0;font-size:14px}
.older small{color:var(--mute);white-space:nowrap}
.more{margin-left:auto;background:none;border:0;color:var(--mute);font-size:13px;font-weight:700;padding:2px 8px;border-radius:6px}
.more:hover{color:var(--ink);background:var(--hover)}
section{display:none}
section.on{display:block}
.pg{font:900 clamp(30px,5vw,44px)/1.2 "Noto Serif TC",serif;margin:32px 0 20px}
.bento,.cols{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.bc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;min-width:0;animation:rise .55s both;box-shadow:0 1px 2px rgba(40,30,10,.04)}
.bc:nth-child(2){animation-delay:.06s}.bc:nth-child(3){animation-delay:.12s}.bc:nth-child(4){animation-delay:.18s}.bc:nth-child(5){animation-delay:.24s}.bc:nth-child(6){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s12{grid-column:span 12}
.bc h3{margin:0 0 12px;font:900 17px "Noto Serif TC",serif;display:flex;align-items:baseline;gap:8px}
.bc h3 em{font:500 12px "Noto Sans TC",sans-serif;color:var(--mute);font-style:normal}
.lab{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.14em;margin-bottom:8px}
.big{font:900 clamp(60px,7vw,88px)/1 "Noto Serif TC",serif;color:var(--gt)}
.big i{font:700 16px "Noto Sans TC",sans-serif;color:var(--mute);margin-left:8px;font-style:normal}
.et{font-weight:700;font-size:18px;margin:12px 0 2px;overflow-wrap:anywhere}
ul{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:10px 10px;border-radius:10px;transition:background .15s}
.row:hover{background:var(--hover)}
.row.sm{padding:7px 8px}
.row.one{grid-template-columns:1fr auto}
.row.ev{grid-template-columns:52px 1fr auto}
.row.sm.ev{grid-template-columns:44px 1fr auto}
.row.m{grid-template-columns:40px 1fr;align-items:start}
.row.sm.m{grid-template-columns:34px 1fr}
.n{color:var(--mute);text-align:center;font-variant-numeric:tabular-nums}
.t{min-width:0;overflow-wrap:anywhere}
.t small,.row>small{color:var(--mute);font-size:13px;display:block;line-height:1.4}
.date{width:52px;text-align:center;border-radius:12px;padding:6px 0;background:var(--chip)}
.sm .date{width:44px;padding:4px 0}
.date b{display:block;font:900 21px/1.1 "Noto Serif TC",serif}
.sm .date b{font-size:17px}
.date span{font-size:12px;color:var(--mute)}
.past{opacity:.45}
.pill{font-size:12px;font-weight:700;color:var(--gt);background:var(--chip);border-radius:999px;padding:3px 12px;white-space:nowrap}
.pill.hot{background:linear-gradient(100deg,#d4af37,#f6e27a);color:#2a2000}
.new{font-size:11px;font-weight:900;letter-spacing:.1em;color:#2a2000;background:linear-gradient(100deg,#d4af37,#f6e27a);border-radius:999px;padding:1px 9px;margin-right:8px;vertical-align:1px}
.done .t>span{text-decoration:line-through;opacity:.5}
.ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;font-size:12px;font-weight:900;color:#2a2000;justify-self:center}
.done .ck{background:#d4af37;border-color:#d4af37}
.empty{display:block;color:var(--mute);padding:8px 10px}
.prog{height:5px;border-radius:3px;background:var(--chip);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#b8860b,#f6e27a);border-radius:3px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:12px 8px;text-align:center;border-top:1px solid var(--line);border-left:1px solid var(--line)}
tr>:first-child{border-left:0;width:44px;color:var(--mute)}
thead th{border-top:0;font-size:13px;color:var(--mute)}
th.today,td.today{background:rgba(212,175,55,.13)}
th.today{color:var(--gt)}
td{height:52px;font-weight:500}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.ph{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--chip);margin:0}
.ph img,.thumbs img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;transition:transform .4s}
.ph:hover img{transform:scale(1.05)}
.ph::after{content:"+";position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#d4af37,#f6e27a);color:#2a2000;display:grid;place-items:center;font:700 24px/1 sans-serif;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
.ph:hover::after{opacity:1;transform:none}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.thumbs img{aspect-ratio:1;border-radius:12px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#2a2000}
.sm .av{width:32px;height:32px;font-size:14px}
#ov-msg ul{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px}
form{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
input,textarea{font:inherit;color:var(--ink);background:var(--chip);border:1px solid transparent;border-radius:10px;padding:11px 14px;min-width:0;flex:1 1 140px}
textarea{flex-basis:100%;min-height:80px;resize:vertical}
.btn{font-weight:700;color:#2a2000;background:linear-gradient(100deg,#d4af37,#f6e27a);border:0;border-radius:999px;padding:11px 28px;transition:transform .15s}
.btn:hover{transform:scale(1.04)}
dialog{border:0;background:none;padding:0;max-width:94vw}
dialog::backdrop{background:rgba(0,0,0,.85)}
dialog img{max-width:94vw;max-height:88vh;border-radius:14px}
#mw[data-v]:not([data-v=ov]) .hero,#mw[data-v]:not([data-v=ov]) .note{display:none}
@media(max-width:1000px){.hero{grid-template-columns:1fr;gap:28px;padding:36px 0 28px}.s4{grid-column:span 6}#ov-hw{grid-column:span 12}.s5,.s6,.s7{grid-column:span 12}}
@media(max-width:700px){.tb{flex-wrap:wrap;gap:8px 12px;padding:10px 16px}.brand{flex:1}nav{order:3;width:100%;margin:0}main{padding:0 16px 80px}.s4{grid-column:span 12}.thumbs{grid-template-columns:repeat(2,1fr)}.in{padding:22px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
.me{font-size:13px;font-weight:700;color:var(--mute);white-space:nowrap}
.outb{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;white-space:nowrap}
.outb:hover{background:var(--hover)}
#gate{display:none;min-height:calc(100vh - 90px);place-items:center;padding:24px}
body.locked #gate{display:grid}
body.locked main,body.locked #nav{display:none}
#gate .gold{width:100%;max-width:400px}
#gate .in{padding:32px 30px;text-align:center}
.gt{font:900 34px/1.2 "Noto Serif TC",serif;margin:10px 0 20px}
#gate form{margin:0}
#gate input{text-align:center}
.gerr{min-height:1.6em;margin:12px 0 0;font-size:14px;color:#c0392b}
tr>:first-child{width:64px}
th small{display:block;font-size:11px;font-weight:400;line-height:1.3;margin-top:2px;white-space:nowrap}
td.now{box-shadow:inset 0 0 0 2px #d4af37;font-weight:700;background:rgba(212,175,55,.2)}
.keep{flex-basis:100%;display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px;color:var(--mute);cursor:pointer}
.keep input{flex:none;width:18px;height:18px;accent-color:#d4af37}
</style>
</head>
<body class="locked">
<header class="top"><div class="tb">
<div class="brand"><span class="mark" id="mk">我</span><span id="logo"></span></div>
<nav id="nav" role="tablist">
<button role="tab" data-t="ov" aria-selected="true">總攬</button>
<button role="tab" data-t="news" aria-selected="false">公告・行事曆</button>
<button role="tab" data-t="sched" aria-selected="false">課表・作業</button>
<button role="tab" data-t="gal" aria-selected="false">相簿</button>
<button role="tab" data-t="chat" aria-selected="false">留言牆</button>
</nav>
<span class="me" id="me" hidden></span><button class="outb" id="out" hidden>登出</button>
<button id="theme" aria-label="切換亮色與暗色"><svg class="tl" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg><svg class="td" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</div></header>

<div id="gate"><div class="gold"><div class="in">
<div class="gtext">班級登入</div>
<h2 class="gt" id="gtitle"></h2>
<form id="lf" hidden><input id="no" type="number" inputmode="numeric" min="1" max="99" placeholder="座號" required aria-label="座號"><input id="pw" type="password" placeholder="密碼" required autocomplete="current-password" aria-label="密碼"><label class="keep"><input type="checkbox" id="keep" checked>保持登入(這台裝置)</label><button class="btn" style="flex-basis:100%">登入</button></form>
<p class="gerr" id="gerr">載入中…</p>
</div></div></div>

<main id="mw" data-v="ov">
<p class="note" id="note" hidden style="margin-top:20px">尚未設定 Firebase:請打開 index.html,把設定貼到 FIREBASE_CONFIG。</p>
<div class="hero">
<div><div class="kick">班級</div><h1 id="title"></h1><p class="tag" id="tag"></p><div class="meta" id="meta"></div></div>
<div class="gold"><div class="in" id="annbox"></div></div>
</div>

<section id="ov" class="on"><div class="bento">
<div class="bc s4" id="ov-next"></div>
<div class="bc s4" id="ov-today"></div>
<div class="bc s4" id="ov-hw"></div>
<div class="bc s5" id="ov-evt"></div>
<div class="bc s7" id="ov-pics"></div>
<div class="bc s12" id="ov-msg"></div>
</div></section>

<section id="news"><h2 class="pg">公告・行事曆</h2><div class="cols">
<div class="bc s6"><h3>公告 <em id="ca"></em></h3><ul id="la"></ul></div>
<div class="bc s6"><h3>行事曆 <em id="ce"></em></h3><ul id="le"></ul></div>
</div></section>
<section id="sched"><h2 class="pg">課表・作業</h2>
<div class="bc" style="margin-bottom:18px"><h3>每週課表</h3><div class="tw"><table id="tb"></table></div></div>
<div class="bc"><h3>作業提醒 <em id="ch"></em></h3><ul id="lh"></ul></div>
</section>
<section id="gal"><h2 class="pg">相簿</h2><div class="bc"><h3>班級相簿 <em id="cp"></em></h3><div class="pics" id="pics"></div></div></section>
<section id="chat"><h2 class="pg">留言牆</h2><div class="bc"><h3>大家的留言 <em id="cm"></em></h3>
<form id="fm"><textarea name="m" placeholder="想對大家說什麼?" required maxlength="300" aria-label="留言內容"></textarea><button class="btn">送出留言</button></form>
<p class="empty" id="fmnote" hidden>管理員請從後台管理留言。</p>
<ul id="lm"></ul></div></section>
</main>
<dialog id="dlg"><img id="big" alt="放大的照片"></dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,setPersistence,browserLocalPersistence,browserSessionPersistence} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,onSnapshot,addDoc,getDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const FIREBASE_CONFIG={apiKey:"AIzaSyCjH-28OnHBKh8cFuL3rPkmxtmV7ixvAnU",authDomain:"class-9ab0a.firebaseapp.com",projectId:"class-9ab0a",storageBucket:"class-9ab0a.firebasestorage.app",messagingSenderId:"1061856226694",appId:"1:1061856226694:web:fa6467c7db7008df329007"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dleft=d=>Math.round((new Date(d+'T00:00:00')-new Date(new Date().toDateString()))/864e5);
const when=n=>n<0?'已過':n===0?'今天':n+' 天後';
const fmt=ts=>new Date(ts).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
const list=(ul,rows,empty)=>{$(ul).innerHTML=rows.length?rows.join(''):`<li class="empty">${empty}</li>`};
const hue=n=>[...n].reduce((h,c)=>h+c.charCodeAt(0),0)*47%360;
const D={title:'我們班',tag:'班級專屬網站,公告、課表、照片都在這裡。',ann:[],evt:[],hw:[],sched:{},times:{},photos:[],msg:[]};

$('#theme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('cls-theme',t)}catch(e){}};
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
  $('#mw').dataset.v=b.dataset.t;
  document.querySelectorAll('#nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t));
  scrollTo({top:0,behavior:'smooth'});
});
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){document.querySelector('#nav [data-t="'+g.dataset.go+'"]').click();return}
  const im=e.target.closest('.pics img,.thumbs img');if(im){$('#big').src=im.src;$('#dlg').showModal()}});
$('#dlg').onclick=()=>$('#dlg').close();

const put=(sel,h)=>{const el=$(sel);if(el.dataset.h!==h){el.dataset.h=h;el.innerHTML=h}};
const head=(t,em,go)=>`<h3>${t}${em?` <em>${em}</em>`:''}<button class="more" data-go="${go}">查看全部 ›</button></h3>`;
const byNew=a=>[...a].sort((x,y)=>y.ts-x.ts);

function rMeta(){$('#meta').textContent=`${D.ann.length} 則公告 · ${D.evt.length} 個活動 · ${D.photos.length} 張照片 · ${D.msg.length} 則留言`}
function rSite(){$('#gtitle').textContent=D.title;document.title=D.title;$('#logo').textContent=D.title;$('#title').textContent=D.title;$('#tag').textContent=D.tag;$('#mk').textContent=[...D.title][0]||'班'}
function rAnn(){$('#ca').textContent=D.ann.length?D.ann.length+' 則':'';
  list('#la',byNew(D.ann).map((o,i)=>`<li class="row one"><span class="t">${i===0?'<span class="new">最新</span>':''}${esc(o.t)}<small>${fmt(o.ts)}</small></span></li>`),'目前沒有公告');rMeta()}
function rEvt(){$('#ce').textContent=D.evt.length?D.evt.length+' 項':'';
  list('#le',[...D.evt].sort((p,q)=>{const u=dleft(p.d)<0,v=dleft(q.d)<0;return u!==v?u-v:(u?(p.d<q.d?1:-1):(p.d<q.d?-1:1))}).map(o=>{const n=dleft(o.d),d=new Date(o.d+'T00:00:00');return `<li class="row ev ${n<0?'past':''}"><div class="date"><b>${d.getDate()}</b><span>${d.getMonth()+1}月</span></div><span class="t">${esc(o.t)}</span><span class="pill ${n>=0&&n<=3?'hot':''}">${when(n)}</span></li>`}),'目前沒有活動');rMeta()}
function rHw(){const open=D.hw.filter(h=>!h.done).length;$('#ch').textContent=open?open+' 項未完成':'';
  list('#lh',[...D.hw].sort((p,q)=>(!!p.done-!!q.done)||(p.d<q.d?-1:1)).map(o=>{const n=dleft(o.d);return `<li class="row ${o.done?'done':''}"><span class="ck">${o.done?'✓':''}</span><span class="t"><span>${esc(o.t)}</span><small>${esc(o.d)}</small></span><span class="pill ${!o.done&&n<=1?'hot':''}">${when(n)}</span></li>`}),'目前沒有作業')}
function rSched(){const Dn=['一','二','三','四','五'],now=new Date(),td=now.getDay()-1,hm=now.getHours()*60+now.getMinutes();
  const tm=p=>{const t=D.times[p];return t&&t[0]&&t[1]?t:null};
  const mins=x=>{const [a,b]=x.split(':');return a*60+ +b};
  const cur=p=>{const t=tm(p);return !!t&&hm>=mins(t[0])&&hm<mins(t[1])};
  let h='<thead><tr><th></th>'+Dn.map((d,i)=>`<th class="${i===td?'today':''}">週${d}</th>`).join('')+'</tr></thead><tbody>';
  for(let p=1;p<=8;p++){const t=tm(p);h+=`<tr><th>${p}${t?`<small>${esc(t[0])}<br>${esc(t[1])}</small>`:''}</th>`+Dn.map((_,i)=>`<td class="${i===td?'today':''} ${i===td&&cur(p)?'now':''}">${esc(D.sched[i+'-'+p]||'')}</td>`).join('')+'</tr>'}
  $('#tb').innerHTML=h+'</tbody>';rOv()}
function rPics(){$('#cp').textContent=D.photos.length?D.photos.length+' 張':'';
  $('#pics').innerHTML=D.photos.length?byNew(D.photos).map(p=>`<figure class="ph"><img src="${esc(p.url)}" alt="班級照片" loading="lazy"></figure>`).join(''):'<p class="empty">相簿還是空的</p>';rMeta()}
function rMsg(){$('#cm').textContent=D.msg.length?D.msg.length+' 則':'';
  list('#lm',byNew(D.msg).map(o=>`<li class="row m"><span class="av" style="background:hsl(${hue(o.n)} 70% 72%)">${esc(o.n[0]||'?')}</span><span class="t"><b>${esc(o.n)}</b> <small style="display:inline">${o.no?'座號 '+esc(o.no)+' · ':''}${fmt(o.ts)}</small><br>${esc(o.m)}</span></li>`),'還沒有留言,來當第一個吧');rMeta()}

function rOv(){
  const td=new Date().getDay()-1,wk=['週一','週二','週三','週四','週五'],A=byNew(D.ann);
  put('#annbox',`<div class="ah"><span class="gtext">公　告</span><button class="more" data-go="news">全部 ›</button></div>`+(A[0]?`<p class="feat">${esc(A[0].t)}</p><div class="ts">${fmt(A[0].ts)}</div>`+(A.length>1?`<ul class="older">${A.slice(1,3).map(o=>`<li><span class="t">${esc(o.t)}</span><small>${fmt(o.ts)}</small></li>`).join('')}</ul>`:''):`<p class="feat" style="color:var(--mute)">目前沒有公告</p>`));
  const up=D.evt.filter(e=>dleft(e.d)>=0).sort((a,b)=>a.d<b.d?-1:1),n0=up[0];
  put('#ov-next',`<div class="lab">下一個活動</div>`+(n0?`<div class="big">${dleft(n0.d)===0?'今天':dleft(n0.d)}${dleft(n0.d)===0?'':'<i>天後</i>'}</div><p class="et">${esc(n0.t)}</p><small style="color:var(--mute)">${esc(n0.d)}</small>`:`<div class="big">—</div><p class="et">目前沒有待辦活動</p>`));
  const subj=[];if(td>=0&&td<5)for(let p=1;p<=8;p++){const s=D.sched[td+'-'+p],t=D.times[p];if(s)subj.push(`<li class="row sm"><span class="n">${p}</span><span class="t">${esc(s)}</span>${t&&t[0]?`<small>${esc(t[0])}–${esc(t[1]||'')}</small>`:'<span></span>'}</li>`)}
  put('#ov-today',head('今日課表',td>=0&&td<5?wk[td]:'假日','sched')+`<ul>${subj.join('')||'<li class="empty">今天沒有課程</li>'}</ul>`);
  const open=D.hw.filter(h=>!h.done).sort((a,b)=>a.d<b.d?-1:1),tot=D.hw.length,done=tot-open.length;
  put('#ov-hw',head('作業',open.length?open.length+' 項未完成':'','sched')+`<ul>${open.slice(0,4).map(o=>{const n=dleft(o.d);return `<li class="row sm"><span class="ck"></span><span class="t">${esc(o.t)}</span><span class="pill ${n<=1?'hot':''}">${when(n)}</span></li>`}).join('')||`<li class="empty">${tot?'作業全部完成':'目前沒有作業'}</li>`}</ul>`+(tot?`<div class="prog"><i style="width:${done/tot*100}%"></i></div>`:''));
  put('#ov-evt',head('近期活動',up.length?up.length+' 項':'','news')+`<ul>${up.slice(0,4).map(o=>{const n=dleft(o.d),d=new Date(o.d+'T00:00:00');return `<li class="row sm ev"><div class="date"><b>${d.getDate()}</b><span>${d.getMonth()+1}月</span></div><span class="t">${esc(o.t)}</span><span class="pill ${n<=3?'hot':''}">${when(n)}</span></li>`}).join('')||'<li class="empty">目前沒有活動</li>'}</ul>`);
  const ph=byNew(D.photos).slice(0,4);
  put('#ov-pics',head('最新照片',D.photos.length?D.photos.length+' 張':'','gal')+(ph.length?`<div class="thumbs">${ph.map(p=>`<img src="${esc(p.url)}" alt="班級照片" loading="lazy">`).join('')}</div>`:'<p class="empty">相簿還是空的</p>'));
  put('#ov-msg',head('最新留言',D.msg.length?D.msg.length+' 則':'','chat')+`<ul>${byNew(D.msg).slice(0,3).map(o=>`<li class="row sm m"><span class="av" style="background:hsl(${hue(o.n)} 70% 72%)">${esc(o.n[0]||'?')}</span><span class="t"><b>${esc(o.n)}</b><br>${esc(o.m)}</span></li>`).join('')||'<li class="empty">還沒有留言</li>'}</ul>`);
}
const R={ann:rAnn,evt:rEvt,hw:rHw,photos:rPics,msg:rMsg};
Object.keys(R).forEach(k=>{const f=R[k];R[k]=()=>{f();rOv()}});
setInterval(rSched,60000);
rSite();rMeta();rAnn();rEvt();rHw();rSched();rPics();rMsg();rOv();

if(!FIREBASE_CONFIG.projectId){document.body.classList.remove('locked');$('#note').hidden=false}
else{
  const app=initializeApp(FIREBASE_CONFIG),db=getFirestore(app),auth=getAuth(app),bad=()=>{};
  let unsubs=[],me=null,last=0,staffName='管理員';
  const stop=()=>{unsubs.forEach(f=>f());unsubs=[]};
  const lock=msg=>{stop();me=null;document.body.classList.add('locked');$('#out').hidden=true;$('#me').hidden=true;$('#gerr').textContent=msg||'';$('#lf').hidden=false};
  const start=()=>{
    document.body.classList.remove('locked');
    Object.keys(R).forEach(k=>unsubs.push(onSnapshot(collection(db,k),s=>{D[k]=s.docs.map(d=>({id:d.id,...d.data()}));R[k]()},bad)));
    unsubs.push(onSnapshot(doc(db,'meta','site'),s=>{const m=s.data()||{};if(m.title)D.title=m.title;if(m.tag)D.tag=m.tag;rSite()},bad));
    unsubs.push(onSnapshot(doc(db,'meta','sched'),s=>{D.sched=(s.data()||{}).cells||{};rSched()},bad));
    unsubs.push(onSnapshot(doc(db,'meta','times'),s=>{D.times=(s.data()||{}).t||{};rSched()},bad));
    $('#me').textContent=me?`座號 ${me.no}・${me.name}`:staffName;$('#me').hidden=false;$('#out').hidden=false;
    $('#fm').hidden=!me;$('#fmnote').hidden=!!me;
  };
  onAuthStateChanged(auth,async u=>{
    if(!u){lock();return}
    try{
      const s=await getDoc(doc(db,'students',u.uid));me=s.exists()?s.data():null;
      if(!me){await getDoc(doc(db,'meta','site'));staffName='管理員';try{const t=await getDoc(doc(db,'teachers',u.uid));if(t.exists())staffName='老師・'+t.data().name}catch(x){}}
      stop();start();
    }catch(e){if(e&&e.code==='permission-denied'){await signOut(auth);lock('此帳號已停用或沒有權限')}else{stop();document.body.classList.add('locked');$('#lf').hidden=true;$('#gerr').textContent='連線不穩,請重新整理頁面(登入狀態還在)'}}
  });
  $('#lf').onsubmit=async e=>{e.preventDefault();$('#gerr').textContent='';
    const no=String(parseInt($('#no').value,10));
    try{const m=await getDoc(doc(db,'login',no));if(!m.exists())throw 0;
      await setPersistence(auth,$('#keep').checked?browserLocalPersistence:browserSessionPersistence);
      await signInWithEmailAndPassword(auth,m.data().email,$('#pw').value);$('#pw').value='';try{localStorage.setItem('cls-no',no)}catch(x){}}
    catch(err){$('#gerr').textContent='座號或密碼錯誤'}};
  try{$('#no').value=localStorage.getItem('cls-no')||''}catch(e){}
  $('#out').onclick=()=>signOut(auth);
  $('#fm').onsubmit=async e=>{e.preventDefault();
    if(!me)return;if(Date.now()-last<15000){alert('留言太快了,請稍等幾秒');return}
    const m=e.target.m.value.trim();if(!m)return;
    try{await addDoc(collection(db,'msg'),{n:me.name,no:me.no,m,ts:Date.now()});last=Date.now();e.target.m.value=''}
    catch(err){alert('送出失敗,請稍後再試')}};
}
</script>
</body>
</html>
