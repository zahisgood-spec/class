<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我們班</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080a18;--ink:#eceeff;--mute:#8f95c4;--line:rgba(255,255,255,.09);--c1:#7ae7ff;--c2:#b69cff;--warm:#ffd9a8;--panel:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.02));color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 16px/1.7 "Noto Sans TC",system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:rgba(8,10,24,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 50% at 12% 0,rgba(122,231,255,.16),transparent 70%),radial-gradient(55% 45% at 95% 20%,rgba(182,156,255,.16),transparent 70%)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(8,10,24,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top>div{max-width:1040px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.logo{font:900 18px "Noto Serif TC",serif;letter-spacing:.06em;margin-right:auto;white-space:nowrap}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{font:500 14px "Noto Sans TC",sans-serif;color:var(--mute);background:none;border:0;border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap;transition:color .2s,background .2s}
nav button:hover{color:var(--ink)}
nav button[aria-selected=true]{color:var(--ink);background:rgba(255,255,255,.1)}
button:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
main{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:0 20px 80px}
.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;align-items:end;padding:72px 0 48px}
h1{font:900 clamp(60px,13vw,148px)/1 "Noto Serif TC",serif;letter-spacing:.02em;margin:0;background:linear-gradient(180deg,#fff 30%,#a9b0ea);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin:16px 0 0;color:var(--mute);font-size:17px;max-width:30em}
.next{padding:22px 24px;border-radius:22px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.next b{display:block;font:900 64px/1 "Noto Serif TC",serif;color:var(--c1)}
.next b i{font:500 16px "Noto Sans TC",sans-serif;color:var(--mute);margin-left:6px;font-style:normal}
.next p{margin:8px 0 0;overflow-wrap:anywhere}
.next small{display:block;color:var(--mute);margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px}
section{display:none}
section.on{display:block}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.panel{position:relative;border:1px solid var(--line);border-radius:22px;background:var(--panel);padding:24px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow:hidden}
.panel::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(320px circle at var(--mx,-200px) var(--my,-200px),rgba(122,231,255,.1),transparent 65%)}
.panel>*{position:relative}
h2{font:600 24px "Noto Serif TC",serif;margin:0 0 16px;display:flex;align-items:baseline;gap:10px}
h2 em{font:500 13px "Noto Sans TC",sans-serif;color:var(--mute);font-style:normal}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0;padding-top:0}
.t{flex:1;min-width:0;overflow-wrap:anywhere}
small{color:var(--mute);font-size:13px;display:block;line-height:1.5}
.date{flex:0 0 auto;width:52px;text-align:center;border:1px solid var(--line);border-radius:14px;padding:6px 0;background:rgba(255,255,255,.04)}
.date b{display:block;font:900 22px/1.1 "Noto Serif TC",serif}
.date span{font-size:12px;color:var(--mute)}
.past{opacity:.45}
.pill{font-size:13px;color:var(--c1);background:rgba(122,231,255,.1);border-radius:999px;padding:2px 12px;white-space:nowrap}
.pill.hot{color:var(--warm);background:rgba(255,217,168,.12)}
.done .t>span{text-decoration:line-through;opacity:.5}
.ck{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--mute);display:grid;place-items:center;font-size:13px;color:#0a0c1c}
.done .ck{background:var(--c1);border-color:var(--c1)}
.empty{color:var(--mute);display:block;padding:6px 0;border:0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 8px;text-align:center;border-left:1px solid var(--line);border-top:1px solid var(--line)}
tr>:first-child{border-left:0;width:44px;color:var(--mute)}
thead th{border-top:0;font-weight:500;color:var(--mute)}
th.today,td.today{background:rgba(122,231,255,.07)}
th.today{color:var(--c1);font-weight:700}
td{height:50px}
.pics{columns:3 190px;column-gap:14px}
.ph{margin:0 0 14px;break-inside:avoid;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.ph img{width:100%;display:block;cursor:zoom-in;transition:transform .5s}
.ph:hover img{transform:scale(1.04)}
.av{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#0a0c1c}
.bub{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 14px}
.bub b{margin-right:8px}
li.m{align-items:flex-start;border:0;padding:8px 0}
dialog{border:0;background:none;padding:0;max-width:94vw}
dialog::backdrop{background:rgba(4,5,16,.9)}
dialog img{max-width:94vw;max-height:88vh;border-radius:16px}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding:48px 0 32px}.logo{display:none}}

form{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
input,textarea{font:inherit;color:var(--ink);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0;flex:1 1 130px;color-scheme:dark}
textarea{flex-basis:100%;min-height:76px;resize:vertical}
.btn{font:700 14px "Noto Sans TC",sans-serif;color:#0a0c1c;background:linear-gradient(100deg,var(--c1),var(--c2));border:0;border-radius:12px;padding:10px 20px;cursor:pointer}
input:focus-visible,textarea:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.note{font-size:14px;color:var(--warm);background:rgba(255,217,168,.08);border:1px solid rgba(255,217,168,.25);border-radius:12px;padding:10px 16px;margin:0 0 20px}
.note[hidden]{display:none}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<header class="top"><div>
<span class="logo" id="logo"></span>
<nav role="tablist">
<button role="tab" data-t="news" aria-selected="true">公告・行事曆</button>
<button role="tab" data-t="sched" aria-selected="false">課表・作業</button>
<button role="tab" data-t="gal" aria-selected="false">相簿</button>
<button role="tab" data-t="chat" aria-selected="false">留言牆</button>
</nav>
</div></header>
<main>
<div class="hero">
<div><h1 id="title"></h1><p class="tag" id="tag"></p></div>
<div class="next" id="next"></div>
</div>
<p class="note" id="note" hidden>尚未設定 Firebase:請打開 index.html,把設定貼到 FIREBASE_CONFIG。</p>
<section id="news" class="on"><div class="cols">
<div class="panel"><h2>公告 <em id="ca"></em></h2><ul id="la"></ul></div>
<div class="panel"><h2>行事曆 <em id="ce"></em></h2><ul id="le"></ul></div>
</div></section>
<section id="sched">
<div class="panel" style="margin-bottom:20px"><h2>每週課表</h2><div class="tw"><table id="tb"></table></div></div>
<div class="panel"><h2>作業提醒 <em id="ch"></em></h2><ul id="lh"></ul></div>
</section>
<section id="gal"><div class="panel"><h2>班級相簿 <em id="cp"></em></h2><div class="pics" id="pics"></div></div></section>
<section id="chat"><div class="panel"><h2>留言牆 <em id="cm"></em></h2>
<form id="fm"><input name="n" id="nm" placeholder="你的名字" required maxlength="12" aria-label="你的名字"><textarea name="m" placeholder="想對大家說什麼?" required maxlength="300" aria-label="留言內容"></textarea><button class="btn">送出留言</button></form>
<ul id="lm"></ul></div></section>
</main>
<dialog id="dlg"><img id="big" alt="放大的照片"></dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,collection,doc,onSnapshot,addDoc,setDoc,deleteDoc,updateDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const FIREBASE_CONFIG={apiKey:"AIzaSyCjH-28OnHBKh8cFuL3rPkmxtmV7ixvAnU",authDomain:"class-9ab0a.firebaseapp.com",projectId:"class-9ab0a",storageBucket:"class-9ab0a.firebasestorage.app",messagingSenderId:"1061856226694",appId:"1:1061856226694:web:fa6467c7db7008df329007"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dleft=d=>Math.round((new Date(d+'T00:00:00')-new Date(new Date().toDateString()))/864e5);
const when=n=>n<0?'已過':n===0?'今天':n+' 天後';
const fmt=ts=>new Date(ts).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
const list=(ul,rows,empty)=>{$(ul).innerHTML=rows.length?rows.join(''):`<li class="empty">${empty}</li>`};
const D={title:'我們班',tag:'班級專屬網站,公告、課表、照片都在這裡。',ann:[],evt:[],hw:[],sched:{},photos:[],msg:[]};

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t));
});
document.addEventListener('pointermove',e=>{const p=e.target.closest&&e.target.closest('.panel');if(p){const r=p.getBoundingClientRect();p.style.setProperty('--mx',e.clientX-r.left+'px');p.style.setProperty('--my',e.clientY-r.top+'px')}});
$('#pics').onclick=e=>{const im=e.target.closest('img');if(im){$('#big').src=im.src;$('#dlg').showModal()}};
$('#dlg').onclick=()=>$('#dlg').close();

function rSite(){document.title=D.title;$('#logo').textContent=D.title;$('#title').textContent=D.title;$('#tag').textContent=D.tag}
function rHero(){
  const up=D.evt.filter(e=>dleft(e.d)>=0).sort((a,b)=>a.d<b.d?-1:1)[0],open=D.hw.filter(h=>!h.done).length;
  $('#next').innerHTML=(up?`<b>${dleft(up.d)===0?'今天':dleft(up.d)}<i>${dleft(up.d)===0?'':'天後'}</i></b><p>${esc(up.t)}</p>`:`<b>—</b><p>目前沒有待辦活動</p>`)+`<small>${open?`還有 ${open} 項作業未完成`:'作業全部完成'}</small>`;
}
function rAnn(){$('#ca').textContent=D.ann.length?D.ann.length+' 則':'';
  list('#la',[...D.ann].sort((a,b)=>b.ts-a.ts).map(o=>`<li><span class="t">${esc(o.t)}<small>${fmt(o.ts)}</small></span></li>`),'目前沒有公告')}
function rEvt(){$('#ce').textContent=D.evt.length?D.evt.length+' 項':'';
  list('#le',[...D.evt].sort((p,q)=>{const u=dleft(p.d)<0,v=dleft(q.d)<0;return u!==v?u-v:(u?(p.d<q.d?1:-1):(p.d<q.d?-1:1))}).map(o=>{const n=dleft(o.d),d=new Date(o.d+'T00:00:00');return `<li class="${n<0?'past':''}"><div class="date"><b>${d.getDate()}</b><span>${d.getMonth()+1}月</span></div><span class="t">${esc(o.t)}</span><span class="pill ${n>=0&&n<=3?'hot':''}">${when(n)}</span></li>`}),'目前沒有活動');rHero()}
function rHw(){const open=D.hw.filter(h=>!h.done).length;$('#ch').textContent=open?open+' 項未完成':'';
  list('#lh',[...D.hw].sort((p,q)=>(!!p.done-!!q.done)||(p.d<q.d?-1:1)).map(o=>{const n=dleft(o.d);return `<li class="${o.done?'done':''}"><span class="ck">${o.done?'✓':''}</span><span class="t"><span>${esc(o.t)}</span><small>${esc(o.d)}</small></span><span class="pill ${!o.done&&n<=1?'hot':''}">${when(n)}</span></li>`}),'目前沒有作業');rHero()}
function rSched(){const Dn=['一','二','三','四','五'],td=new Date().getDay()-1;
  let h='<thead><tr><th></th>'+Dn.map((d,i)=>`<th class="${i===td?'today':''}">週${d}</th>`).join('')+'</tr></thead><tbody>';
  for(let p=1;p<=7;p++)h+=`<tr><th>${p}</th>`+Dn.map((_,i)=>`<td class="${i===td?'today':''}">${esc(D.sched[i+'-'+p]||'')}</td>`).join('')+'</tr>';
  $('#tb').innerHTML=h+'</tbody>'}
function rPics(){$('#cp').textContent=D.photos.length?D.photos.length+' 張':'';
  $('#pics').innerHTML=D.photos.length?[...D.photos].sort((a,b)=>b.ts-a.ts).map(p=>`<figure class="ph"><img src="${esc(p.url)}" alt="班級照片" loading="lazy"></figure>`).join(''):'<p class="empty">相簿還是空的</p>'}
function rMsg(){$('#cm').textContent=D.msg.length?D.msg.length+' 則':'';
  list('#lm',[...D.msg].sort((a,b)=>b.ts-a.ts).map(o=>`<li class="m"><span class="av" style="background:hsl(${[...o.n].reduce((h,c)=>h+c.charCodeAt(0),0)*47%360} 70% 78%)">${esc(o.n[0]||'?')}</span><span class="t bub"><b>${esc(o.n)}</b><small style="display:inline">${fmt(o.ts)}</small><br>${esc(o.m)}</span></li>`),'還沒有留言,來當第一個吧')}
const R={ann:rAnn,evt:rEvt,hw:rHw,photos:rPics,msg:rMsg};
rSite();rHero();rAnn();rEvt();rHw();rSched();rPics();rMsg();

if(!FIREBASE_CONFIG.projectId){$('#note').hidden=false}
else{
  const db=getFirestore(initializeApp(FIREBASE_CONFIG)),bad=()=>{};
  Object.keys(R).forEach(k=>onSnapshot(collection(db,k),s=>{D[k]=s.docs.map(d=>({id:d.id,...d.data()}));R[k]()},bad));
  onSnapshot(doc(db,'meta','site'),s=>{const m=s.data()||{};if(m.title)D.title=m.title;if(m.tag)D.tag=m.tag;rSite()},bad);
  onSnapshot(doc(db,'meta','sched'),s=>{D.sched=(s.data()||{}).cells||{};rSched()},bad);
  try{$('#nm').value=localStorage.getItem('cls-name')||''}catch(e){}
  let last=0;
  $('#fm').onsubmit=async e=>{e.preventDefault();
    if(Date.now()-last<15000){alert('留言太快了,請稍等幾秒');return}
    const n=e.target.n.value.trim(),m=e.target.m.value.trim();if(!n||!m)return;
    try{await addDoc(collection(db,'msg'),{n,m,ts:Date.now()});last=Date.now();e.target.m.value='';try{localStorage.setItem('cls-name',n)}catch(x){}}
    catch(err){alert('送出失敗,請稍後再試')}};
}
(()=>{
  const cv=$('#fx'),g=cv.getContext('2d'),m={x:-999,y:-999},still=matchMedia('(prefers-reduced-motion:reduce)').matches;let W,H,P=[];
  const size=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:Math.min(70,Math.floor(W*H/18000))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*1.4+.5}))};
  addEventListener('resize',size);size();addEventListener('pointermove',e=>{m.x=e.clientX;m.y=e.clientY});
  const step=()=>{g.clearRect(0,0,W,H);
    for(const p of P){const dx=m.x-p.x,dy=m.y-p.y,d=Math.hypot(dx,dy);if(d<170&&d>1){p.vx+=dx/d*.025;p.vy+=dy/d*.025}
      p.vx*=.99;p.vy*=.99;if(!still){p.x+=p.vx;p.y+=p.vy}if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      g.fillStyle='rgba(236,238,255,.55)';g.beginPath();g.arc(p.x,p.y,p.r,0,6.3);g.fill()}
    for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);if(d<130){g.strokeStyle=`rgba(122,231,255,${(1-d/130)*.22})`;g.beginPath();g.moveTo(P[i].x,P[i].y);g.lineTo(P[j].x,P[j].y);g.stroke()}}
    for(const p of P){const d=Math.hypot(m.x-p.x,m.y-p.y);if(d<150){g.strokeStyle=`rgba(182,156,255,${(1-d/150)*.5})`;g.beginPath();g.moveTo(m.x,m.y);g.lineTo(p.x,p.y);g.stroke()}}
    if(!still)requestAnimationFrame(step)};step();
})();
</script>
</body>
</html>
